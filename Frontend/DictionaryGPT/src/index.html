<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>DictionaryGPT</title>
    <link rel="stylesheet" href="index.css" />
    <script
      src="https://kit.fontawesome.com/0f2c0a5a7e.js"
      crossorigin="anonymous"
    ></script>
    <script src="side.js"></script>
    <script defer src="index.js"></script>
  </head>
  <body>
    <nav>
      <div class="left-nav">
        <button class="nav-link" id="History">
          <img src="./assets/History.svg" alt="" />
        </button>
      </div>
      <div class="right-nav">
        <button class="nav-link" id="Drop-Down">
          <img src="./assets/Drop-Down.svg" alt="" />
        </button>
        <button class="nav-link" id="Minus">
          <img src="./assets/minus.svg" alt="" />
        </button>
        <button class="nav-link" id="Close">
          <img src="./assets/close.svg" alt="" />
        </button>
      </div>
    </nav>
    <div class="BodyText">
      <h1>DictionaryGPT</h1>
      <p>What can I help you with today?</p>
    </div>
    <div class="search-bar">
      <img class="search-icon" src="./assets/search.svg" alt="" />
      <form id="WordSearch" method="POST">
        <input
          type="text"
          id="Word"
          name="Word"
          placeholder="Search for a word"
        />
      </form>
    </div>

    <!-- page 2 -->

    <div class="border passive">
      <h1 class="word" id="word"></h1>

      <div class="pronunciation">
        <span class="pronunciation-label">Pronunciation:</span>
        <span class="split-up" id="pronunciation_splitup"></span>
      </div>

      <div class="etymology">
        <h3>Etymology</h3>
        <p id="root_of_the_word"></p>
      </div>

      <div class="section synonyms">
        <h3>Synonyms</h3>
        <ul class="synonym-list" id="synonyms"></ul>
      </div>

      <div class="section meanings">
        <h3>Meanings</h3>
        <div id="meaning"></div>
      </div>
    </div>
  </body>
</html>
