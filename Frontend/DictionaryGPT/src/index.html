<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>DictionaryGPT</title>
    <link rel="stylesheet" href="index.css" />
    <script
      src="https://kit.fontawesome.com/0f2c0a5a7e.js"
      crossorigin="anonymous"
    ></script>
    <script src="side.js"></script>
    <script src="index.js"></script>
  </head>
  <body>
    <nav>
      <div class="left-nav">
        <button class="nav-link" id="History">
          <img src="./assets/Home.svg" alt="" />
        </button>
      </div>
      <div class="right-nav">
        <button class="nav-link" id="Drop-Down">
          <img src="./assets/Drop-Down.svg" alt="" />
        </button>
        <button class="nav-link" id="Minus">
          <img src="./assets/minus.svg" alt="" />
        </button>
        <button class="nav-link" id="Close">
          <img src="./assets/close.svg" alt="" />
        </button>
      </div>
    </nav>
    <div class="BodyText">
      <h1>Pocket Dictionary</h1>
      <p>What can I help you with today?</p>
    </div>
    <div class="search-bar">
      <img class="search-icon" src="./assets/search.svg" alt="" />
      <form id="WordSearch" method="POST">
        <input
          type="text"
          id="Word"
          name="Word"
          placeholder="Search for a word"
        />
      </form>
    </div>
    <div class="credits-footer">
      <span class="credits">Created by: Kaushiik V</span>
    </div>

    <!-- page 2 -->

    <div class="border passive">
      <!-- <div class="word" id="word">
        <span class="word" id="word">THE WORD</span>
      </div>
      <div class="pronunciation">
        <span class="pronunciation-label"></span>
        <span class="split-up" id="pronunciation">Split-up</span>
      </div>
      <div class="etymology">
        <span class="root" id="root">Root</span>
      </div>
      <div class="synonyms">
        <ul class="synonym-list" id="synonyms">
          Synonyms:
        </ul>
      </div>
      <div class="meanings">
        <span id="POS">Meaning:</span>
        <div id="meaning"></div>
      </div> -->
    </div>

    <!-- Drop-Down Popup -->
    <div class="drop-popup" id="dropPopup">
      <div class="drop-popup-content">
        <h3>Settings</h3>
        <div class="settings-options">
          <div class="setting-item">
            <label class="setting-label">Theme</label>
            <select class="setting-select">
              <option value="dark">Dark</option>
              <option value="light">Light</option>
            </select>
          </div>
          <div class="setting-item">
            <label class="setting-label">Font Size</label>
            <select class="setting-select">
              <option value="small">Small</option>
              <option value="medium">Medium</option>
              <option value="large">Large</option>
            </select>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
